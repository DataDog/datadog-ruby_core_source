name: Publish Gem

# Creating a GitHub release (vX.Y.Z tag) is the only manual step. This
# workflow runs on the tag: tests, gem push to rubygems.org, and the notify
# job that tells dd-trace-rb to pin the new version.

on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/test-compilation.yml

  publish:
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@dffb23f65a78bba8db45d387d5ea1bbd6be3ef18 # v1.293.0
        with:
          bundler-cache: true
          ruby-version: '3.2.4'
      - name: Read gem version
        id: version
        run: echo "version=$(ruby -e 'require "./lib/datadog/ruby_core_source/version"; print Datadog::RubyCoreSource::VERSION')" >> "$GITHUB_OUTPUT"
      - uses: rubygems/release-gem@e9a6361a0b14562539327c2a02373edc56dd3169 # v1.1.4

  notify-consumers:
    name: Notify consumers
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/dd-trace-rb
          policy: datadog-ruby_core_source.notify-consumers
      - name: Wait for token propagation
        run: sleep 30
      - name: Dispatch to DataDog/dd-trace-rb
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh api "repos/DataDog/dd-trace-rb/dispatches" \
            -f event_type=internal-dep-updated \
            -f "client_payload[gem]=datadog-ruby_core_source" \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[commit]=${{ github.sha }}" \
            -f "client_payload[triggered_by]=${{ github.repository }}" \
            -f "client_payload[source_run_url]=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
